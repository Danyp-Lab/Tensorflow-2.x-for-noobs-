[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tensorflow-2-noobs"
version = "1.0.0"
description = "TensorFlow 2.x interactive tutorials and basic deep learning model architectures"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0"
authors = [
    { name = "Danial Pahlavan", email = "danialpahlavan@gmail.com" },
]
dependencies = [
    "tensorflow>=2.13.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
